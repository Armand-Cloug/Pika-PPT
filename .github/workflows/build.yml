name: Build & push — Pika-PPT
on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Publier également le tag flottant latest
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: pika-ppt-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/armand-cloug/pika-ppt/web
    steps:
      - uses: actions/checkout@v4
      - name: Validation du Compose
        env:
          DOMAIN: pika-ppt.cloug.fr
          IMAGE_TAG: validation
          AUTH_USERNAME: validation
          AUTH_PASSWORD: validation-only
        run: |
          docker compose --env-file /dev/null -f docker-compose.yml config --quiet
      - name: Tags
        id: meta
        env:
          BUILD_METADATA: 'true'
        run: bash .github/scripts/metadata.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Protéger les tags immuables déjà publiés
        env:
          BUILD_TAG: ${{ steps.meta.outputs.build_tag }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          for tag in "$BUILD_TAG" "$SHA_TAG"; do
            if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then
              echo "::error::Tag déjà publié : $tag. Redéployer ce tag, ou créer un nouveau commit."
              exit 1
            fi
          done
      - name: Build, validation des manifestes et Nginx, publication GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.build_tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ inputs.push_latest && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha,scope=pika-ppt
          cache-to: type=gha,scope=pika-ppt,mode=max
      - name: Images publiées
        env:
          VERSION_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_TAG: ${{ steps.meta.outputs.build_tag }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          tags=("$VERSION_TAG" "$BUILD_TAG" "$SHA_TAG")
          if [ "$PUSH_LATEST" = true ]; then tags+=(latest); fi
          for tag in "${tags[@]}"; do
            printf '%s\n' "- \`$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\nDéployer et promouvoir le tag `%s`.\n' "$BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
