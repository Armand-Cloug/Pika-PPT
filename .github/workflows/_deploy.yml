name: Deploy — réutilisable
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        type: string
        default: ''
      prune_images:
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://pika-ppt.cloug.fr' || 'https://preprod.pika-ppt.cloug.fr' }}
    concurrency:
      group: pika-ppt-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validation des paramètres
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in preprod|production) ;; *) exit 1 ;; esac
      - name: Résolution du tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/metadata.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérification GHCR et résolution du digest
        id: registry
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "ghcr.io/armand-cloug/pika-ppt/web:$IMAGE_TAG" --format '{{json .Manifest}}' |
            jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: SSH strict, synchronisation, pull et healthcheck
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest }}
          PRUNE_IMAGES: ${{ inputs.prune_images }}
          SSH_DEPLOY_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy.sh
      - name: Résultat
        if: always()
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.registry.outputs.digest }}
          RESULT: ${{ job.status }}
        run: |
          printf '### Pika-PPT — %s\n\nTag : `%s`\n\nDigest : `%s`\n\nRésultat : %s\n' "$TARGET_ENV" "$IMAGE_TAG" "$DIGEST" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
