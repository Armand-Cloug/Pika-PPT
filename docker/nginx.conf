worker_processes 1;
pid /tmp/pika/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 1m;
    client_body_temp_path /tmp/pika/client;
    proxy_temp_path /tmp/pika/proxy;
    fastcgi_temp_path /tmp/pika/fastcgi;
    uwsgi_temp_path /tmp/pika/uwsgi;
    scgi_temp_path /tmp/pika/scgi;
    log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    map $uri $cache_control {
        default "private, no-cache";
        ~*\.(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm|mp3|ogg)$ "private, max-age=3600";
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        auth_basic "Pika-PPT";
        auth_basic_user_file /tmp/pika/auth/htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $cache_control;
        error_page 403 404 /404.html;
        location = /404.html { internal; }
        location ~ (^|/)\. { return 404; }
        location ~* (^|/)(Dockerfile|nginx\.conf|docker-compose\.yml|compose\.yml|credentials\.json|secrets\.json|config\.json|package(-lock)?\.json)$ { return 404; }
        location ~* \.(env|pem|key|sql|sqlite|bak|conf|yml|yaml|sh|py)$ { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
    # Not reachable by Traefik or peer containers: separate loopback listener.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        access_log off;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / { return 404; }
    }
}
